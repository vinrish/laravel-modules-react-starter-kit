name: tests

on:
  push:
    branches:
      - master
  pull_request:
      branches:
          - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: pcov
          ini-values: zend.assertions=1

      -   name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
              version: 10
              run_install: false

      -   name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version: 24
              cache: pnpm
              cache-dependency-path: pnpm-lock.yaml

      -   name: Cache Composer Dependencies
          uses: actions/cache@v6
          with:
              path: vendor
              key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install pnpm Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Assets
        run: pnpm run build

      -   name: Cache Rector
          uses: actions/cache@v6
          with:
              path: /tmp/rector
              key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-rector-

      -   name: Cache PHPStan
          uses: actions/cache@v6
          with:
              path: /tmp/phpstan
              key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-phpstan-

      -   name: Create Cache Directories
          run: mkdir -p /tmp/rector /tmp/phpstan

      -   name: Tests
          run: composer test

      - name: Run CI Checks
        run: composer ci:check
